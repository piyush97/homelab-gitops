# Common handlers
---

- name: restart ssh
  ansible.builtin.systemd:
    name: ssh
    state: restarted
  listen: restart ssh

- name: restart node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: restarted
    daemon_reload: true
  listen: restart node_exporter

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  listen: reload systemd
