# Main playbook for all homelab containers
---
- name: Configure all containers
  hosts: all
  become: true

  roles:
    - common

  tags:
    - base
    - common

- name: Configure media stack
  hosts: media
  become: true

  roles:
    - docker

  vars:
    # Media-specific Docker configuration
    docker:
      enabled: true
      compose_version: "{{ docker.compose_version }}"
      data_root: "{{ docker_mount }}"
      daemon: "{{ docker.daemon }}"

  tags:
    - media
    - docker

- name: Configure monitoring stack
  hosts: monitoring
  become: true

  roles:
    - monitoring

  tasks:
    - name: Configure Prometheus
      ansible.builtin.include_tasks: ../tasks/prometheus.yml
      when: "'prometheus' in services"

  # TODO: Grafana / Uptime Kuma task files not yet committed.
  # Add here once ../tasks/grafana.yml and ../tasks/uptimekuma.yml land.

  tags:
    - monitoring

- name: Configure security stack
  hosts: security
  become: true

  roles:
    - docker

  tasks:
  # TODO: SWAG / WireGuard / Vaultwarden task files not yet committed.
  # Add here once ../tasks/swag.yml, ../tasks/wireguard.yml, and
  # ../tasks/vaultwarden.yml land.

  tags:
    - security

- name: Configure business applications
  hosts: business
  become: true

  roles:
    - docker

  tasks:
  # TODO: Immich / Paperless-ngx / Odoo / file server / ntfy task files not
  # yet committed. Add here once the ../tasks/*.yml files land.

  tags:
    - business
