name: Infrastructure Drift Detection

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
  TF_VAR_proxmox_api_user: ${{ secrets.PROXMOX_API_USER }}
  TF_VAR_proxmox_api_password: ${{ secrets.PROXMOX_API_PASSWORD }}

jobs:
  drift-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        # -backend=false: no remote backend is configured; state stays local.
        # A real backend/statefile is required for a meaningful drift diff,
        # see MAINTAINING.md "Drift detection" for how to enable one.
        run: terraform init -backend=false -input=false

      - name: Terraform Plan - Detect Drift
        # Exit codes: 0 = no changes, 1 = error, 2 = changes detected.
        # Real Proxmox credentials (PROXMOX_API_URL/USER/PASSWORD) are
        # required for a live plan; with no secrets configured the plan step
        # fails gracefully and the workflow reports "skipped" instead of red.
        id: plan
        continue-on-error: true
        run: |
          terraform plan -detailed-exitcode -out=drift-plan 2>&1 | tee drift-output.txt
          PLAN_EXIT_CODE=${PIPESTATUS[0]}
          echo "PLAN_EXIT_CODE=$PLAN_EXIT_CODE" >> "$GITHUB_ENV"
          echo "PLAN_EXIT_CODE=$PLAN_EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$PLAN_EXIT_CODE" -eq 2 ]; then
            echo "DRIFT_DETECTED=true" >> "$GITHUB_ENV"
            echo "🔄 Infrastructure drift detected!"
          elif [ "$PLAN_EXIT_CODE" -eq 0 ]; then
            echo "DRIFT_DETECTED=false" >> "$GITHUB_ENV"
            echo "✅ No infrastructure drift detected"
          else
            echo "❌ Error running terraform plan (missing credentials or state?)"
            echo "DRIFT_DETECTED=skipped" >> "$GITHUB_ENV"
          fi

      - name: Generate Drift Report
        if: env.DRIFT_DETECTED == 'true'
        run: |
          {
            echo "# Infrastructure Drift Report"
            echo "Generated: $(date)"
            echo ""
            echo "## Detected Changes:"
            echo '```hcl'
            terraform show -no-color drift-plan
            echo '```'
          } > drift-report.md

      - name: Upload Drift Report
        if: env.DRIFT_DETECTED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ github.run_number }}
          path: |
            terraform/drift-report.md
            terraform/drift-output.txt
          retention-days: 30

      - name: Notify Drift Detection
        if: env.DRIFT_DETECTED == 'true'
        run: |
          # Send critical notification for infrastructure drift.
          # Override NOTIFICATION_WEBHOOK_URL (a Terraform variable default is
          # not available here); without it the notification is skipped.
          if [ -z "$NOTIFICATION_WEBHOOK_URL" ]; then
            echo "⚠️ Drift detected but NOTIFICATION_WEBHOOK_URL is unset - skipping webhook."
            exit 1
          fi
          curl -fsS -X POST "$NOTIFICATION_WEBHOOK_URL" \
            -H "Content-Type: text/plain; charset=utf-8" \
            -d "🔄 Infrastructure drift detected in homelab GitOps!

            Drift detected at: $(date)
            View details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Manual review and reconciliation may be required."

      - name: Notify Success
        if: env.DRIFT_DETECTED == 'false'
        run: |
          # Send success notification for clean state.
          if [ -z "$NOTIFICATION_WEBHOOK_URL" ]; then
            echo "✅ No drift detected (webhook not configured, skipping notification)."
            exit 0
          fi
          curl -fsS -X POST "$NOTIFICATION_WEBHOOK_URL" \
            -H "Content-Type: text/plain" \
            -d "✅ Daily drift check completed - No infrastructure drift detected"

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
